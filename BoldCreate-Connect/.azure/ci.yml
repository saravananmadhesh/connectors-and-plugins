trigger:
  branches:
    include:
      - development
      - 'feature/*'
      - 'fix/*'

pr:
  branches:
    include:
      - development

pool:
  vmImage: ubuntu-latest

variables:
  NODE_VERSION: '24.x'
  PNPM_VERSION: '10.34.6'

stages:
  - stage: Verify
    displayName: Format · Lint · Typecheck · Unit · Client · Security · Conformance · Protocol · Build · Integration · Browser
    jobs:
      - job: verify
        displayName: verify
        steps:
          - checkout: self
            fetchDepth: 0

          - task: NodeTool@0
            inputs:
              versionSpec: $(NODE_VERSION)
            displayName: Install Node $(NODE_VERSION)

          - script: corepack enable pnpm && corepack prepare pnpm@$(PNPM_VERSION) --activate
            displayName: Enable pnpm via corepack

          - script: pnpm install --frozen-lockfile
            displayName: Install dependencies (frozen lockfile)

          # A migration that already exists on the target branch must be neither changed nor removed.
          - script: |
              git fetch --depth=200 origin development
              if [ "$(Build.Reason)" = "PullRequest" ] || [ "$(Build.SourceBranch)" != "refs/heads/development" ]; then
                base=origin/development
              else
                base=HEAD^1
              fi
              if git diff --name-status "$base"...HEAD -- packages/db/migrations | grep -E '^(M|D)'; then
                echo "A committed migration was changed or deleted; add a new migration instead."
                exit 1
              fi
            displayName: Migrations are append-only

          - task: Cache@2
            inputs:
              key: 'playwright | "$(Agent.OS)" | pnpm-lock.yaml'
              path: $(HOME)/.cache/ms-playwright
              cacheHitVar: PLAYWRIGHT_CACHE_HIT
            displayName: Cache Playwright browsers

          - script: pnpm exec playwright install --with-deps chromium
            displayName: Install Chromium for the browser tests

          # One script runs every check on an isolated Docker-free stack (embedded Postgres,
          # pinned Mailpit, Redis and object-store binaries, the six apps) and writes reports/test-run.
          - script: pnpm test
            displayName: All checks and tests (format, lint, typecheck, unit, client, security, conformance, protocol, build, integration, e2e)

          - task: PublishPipelineArtifact@1
            condition: always()
            inputs:
              targetPath: reports/test-run
              artifact: test-run-report
            displayName: Publish test report (index.html, summary.json, logs)

  - stage: SecurityScan
    displayName: Dependency audit · Secret scan (gitleaks)
    dependsOn: Verify
    jobs:
      - job: scan
        displayName: scan
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(NODE_VERSION)
            displayName: Install Node

          - script: corepack enable pnpm && corepack prepare pnpm@$(PNPM_VERSION) --activate
            displayName: Enable pnpm

          - script: pnpm install --frozen-lockfile
            displayName: Install dependencies

          - script: pnpm audit --audit-level=high
            displayName: Dependency audit (block high+)
            continueOnError: false

          - script: >-
              docker run --rm -v "$(Build.SourcesDirectory):/repo"
              zricethezav/gitleaks:v8.18.4 detect --source /repo --no-banner --redact --exit-code 1
            displayName: Secret scan (gitleaks, whole git history)
