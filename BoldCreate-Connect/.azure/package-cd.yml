# ==============================================================================
# BoldCreate Integrations — Centralized Package CD: Publish NPM & NuGet to Nexus
# ==============================================================================
# Builds and publishes:
#   1. NPM package: @syncfusion/boldcreate-connect (packages/sdk)
#   2. NuGet package: Syncfusion.BoldCreate.Connect (packages/sdk-dotnet)
# Target registries:
#   - Pre-production: boldcreate-preproduction (npm) / boldcreate-nuget-preproduction (nuget)
#   - Production:     boldcreate-production (npm)    / boldcreate-nuget-production (nuget)
# ==============================================================================

trigger: none
pr: none

parameters:
  - name: PublishBranch
    displayName: 'Gitea branch to publish from'
    type: string
    default: 'development'

  - name: TargetEnvironment
    displayName: 'Target Environment'
    type: string
    default: 'Both'
    values:
      - Both
      - PreproductionOnly
      - ProductionOnly

  - name: PublishNPM
    displayName: 'Publish NPM Package (@syncfusion/boldcreate-connect)'
    type: boolean
    default: true

  - name: PublishNuGet
    displayName: 'Publish NuGet Package (Syncfusion.BoldCreate.Connect)'
    type: boolean
    default: true

  - name: PublishAll
    displayName: 'Publish all packages (ignore change detection)'
    type: boolean
    default: false

  - name: Build_Reason
    displayName: 'Build Reason'
    type: string
    default: 'Manual'

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: 'DevOps CI'
  - name: nodeVersion
    value: '24.x'
  - name: pnpmVersion
    value: '10.34.6'
  - name: dotnetVersion
    value: '8.0.x'
  - name: currentDirectory
    value: $(Build.SourcesDirectory)
  - name: npmStagingDir
    value: '$(Build.ArtifactStagingDirectory)/npm-packages'
  - name: nugetStagingDir
    value: '$(Build.ArtifactStagingDirectory)/nuget-packages'

jobs:
  # ==============================================================================
  # JOB: PublishPackagesPreprodAndProd
  # ==============================================================================
  - job: PublishPackagesPreprodAndProd
    displayName: 'Centralized Package CD: Build & Publish NPM and NuGet to Nexus'
    steps:
      # ── 1. Resolve PR and Branch ─────────────────────────────────────────────
      - bash: |
          set -e
          PR_BRANCH="$(System.PullRequest.SourceBranch)"
          PR_NUM="$(System.PullRequest.PullRequestNumber)"
          PR_TARGET="$(System.PullRequest.TargetBranch)"

          case "$PR_BRANCH" in '$('*) PR_BRANCH="" ;; esac
          case "$PR_NUM" in '$('*) PR_NUM="" ;; esac
          case "$PR_TARGET" in '$('*) PR_TARGET="" ;; esac

          BRANCH="${{ parameters.PublishBranch }}"
          BRANCH="${BRANCH#refs/heads/}"
          [ -z "$BRANCH" ] && BRANCH="development"

          echo "============================================="
          echo "Selected Publish Branch : $BRANCH"
          echo "Detected PR Number      : ${PR_NUM:-none}"
          echo "Detected Target Branch  : ${PR_TARGET:-none}"
          echo "Target Environment      : ${{ parameters.TargetEnvironment }}"
          echo "============================================="

          echo "##vso[task.setvariable variable=CHECKOUT_BRANCH]$BRANCH"
          echo "##vso[task.setvariable variable=PR_NUMBER]$PR_NUM"
          echo "##vso[task.setvariable variable=PR_TARGET_BRANCH]$PR_TARGET"
        displayName: 'Resolve PR and Branch'

      # ── 2. Checkout Gitea Repository via Syncfusion Extension ─────────────────
      - checkout: none

      - task: SyncfusionInc.syncfusion-gitea.giteacheckout-task.Syncfusion Gitea Checkout@1
        displayName: 'Checkout Gitea repository'
        inputs:
          giteaUrl: 'https://gitea.syncfusion.com/Syncfusion-Code-Studio/boldcreate-integrations'
          branch: '$(CHECKOUT_BRANCH)'

      # ── 3. Detect Repository Root Directory ──────────────────────────────────
      - bash: |
          if [ -f "$(Build.SourcesDirectory)/boldcreate-integrations/package.json" ]; then
            ROOT_DIR="$(Build.SourcesDirectory)/boldcreate-integrations"
          elif [ -f "$(Build.SourcesDirectory)/package.json" ]; then
            ROOT_DIR="$(Build.SourcesDirectory)"
          else
            FOUND=$(find "$(Build.SourcesDirectory)" -maxdepth 2 -name "package.json" | head -1)
            ROOT_DIR=$(dirname "$FOUND")
          fi
          echo "Repository root located at: $ROOT_DIR"
          echo "##vso[task.setvariable variable=REPO_DIR]$ROOT_DIR"
        displayName: 'Detect Working Directory'

      # ── 4. Setup Toolchains (Node.js 24.x, pnpm 10.x, .NET SDK 8.x) ───────────
      - task: NodeTool@0
        displayName: 'Install Node.js $(nodeVersion)'
        inputs:
          versionSpec: '$(nodeVersion)'

      - script: |
          corepack enable
          corepack prepare pnpm@$(pnpmVersion) --activate
          echo "Node Version: $(node -v)"
          echo "pnpm Version: $(pnpm -v)"
        displayName: 'Enable Corepack & pnpm'

      - task: UseDotNet@2
        displayName: 'Install .NET SDK $(dotnetVersion)'
        inputs:
          packageType: 'sdk'
          version: '$(dotnetVersion)'

      # ── 5. Install Monorepo Dependencies ──────────────────────────────────────
      - script: |
          pnpm install --frozen-lockfile
        displayName: 'pnpm install (frozen lockfile)'
        workingDirectory: $(REPO_DIR)

      # ── 6. Detect Changed Packages (via Gitea PR API / Git Diff) ──────────────
      - bash: |
          set -e
          cd "$(REPO_DIR)"

          PR_NUMBER="$(PR_NUMBER)"
          case "$PR_NUMBER" in '$('*) PR_NUMBER="" ;; esac
          REPO_NAME="${REPO_NAME:-Syncfusion-Code-Studio/boldcreate-integrations}"
          TARGET_BRANCH="$(PR_TARGET_BRANCH)"
          [ -z "$TARGET_BRANCH" ] && TARGET_BRANCH="development"

          CHANGED_FILES=""

          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ] && [ -n "$API_KEY" ]; then
            echo "Detecting changed files for PR #$PR_NUMBER in $REPO_NAME via Gitea API..."
            BASE_URL="https://giteawebhook.syncfusioninternal.com/api/repos/${REPO_NAME}/pulls/${PR_NUMBER}"
            FILES_URL="${BASE_URL}/files"
            PAGE_LIMIT=50

            page=1
            while true; do
              HTTP_CODE=$(curl -s -k -o /tmp/pr_files_page.json -w "%{http_code}" -X GET \
                "${FILES_URL}?page=${page}&limit=${PAGE_LIMIT}" \
                -H "accept: application/json" \
                -H "x-api-key: $API_KEY" || echo "000")

              if [ "$HTTP_CODE" != "200" ]; then
                break
              fi

              PAGE_FILES=$(jq -r '.[].filename // empty' /tmp/pr_files_page.json 2>/dev/null || echo "")
              if [ -z "$PAGE_FILES" ]; then
                break
              fi

              BEFORE=$(printf "%s\n" "$CHANGED_FILES" | sed '/^$/d' | wc -l)
              CHANGED_FILES=$(printf "%s\n%s\n" "$CHANGED_FILES" "$PAGE_FILES" | sed '/^$/d' | sort -u)
              AFTER=$(printf "%s\n" "$CHANGED_FILES" | sed '/^$/d' | wc -l)

              if [ "$AFTER" -eq "$BEFORE" ]; then
                break
              fi
              page=$((page + 1))
            done
          fi

          if [ -z "$CHANGED_FILES" ]; then
            echo "Fallback to local git diff against origin/${TARGET_BRANCH}..."
            CHANGED_FILES=$(git diff --name-only "origin/${TARGET_BRANCH}...HEAD" 2>/dev/null || true)
            if [ -z "$CHANGED_FILES" ]; then
              CHANGED_FILES=$(git diff --name-only HEAD~1..HEAD 2>/dev/null || echo "")
            fi
          fi

          echo "=== Changed Files Detected ==="
          echo "$CHANGED_FILES"
          echo "=============================="

          PUBLISH_ALL="${{ parameters.PublishAll }}"
          BUILD_REASON="${{ parameters.Build_Reason }}"
          SHOULD_PUBLISH_ALL=false

          if [ "$PUBLISH_ALL" = "true" ] || [ "$PUBLISH_ALL" = "True" ] || [ -z "$PR_NUMBER" ] || [ "$(Build.Reason)" = "Manual" ]; then
            SHOULD_PUBLISH_ALL=true
          fi

          BUILD_NPM=false
          BUILD_NUGET=false

          if [ "${{ parameters.PublishNPM }}" = "true" ]; then
            if [ "$SHOULD_PUBLISH_ALL" = "true" ] || echo "$CHANGED_FILES" | grep -q "^packages/sdk/"; then
              echo "NPM SDK package flagged for release: packages/sdk"
              BUILD_NPM=true
            fi
          fi

          if [ "${{ parameters.PublishNuGet }}" = "true" ]; then
            if [ "$SHOULD_PUBLISH_ALL" = "true" ] || echo "$CHANGED_FILES" | grep -q "^packages/sdk-dotnet/"; then
              echo "NuGet SDK package flagged for release: packages/sdk-dotnet"
              BUILD_NUGET=true
            fi
          fi

          echo "Build NPM SDK   : $BUILD_NPM"
          echo "Build NuGet SDK : $BUILD_NUGET"

          echo "##vso[task.setvariable variable=BUILD_NPM]$BUILD_NPM"
          echo "##vso[task.setvariable variable=BUILD_NUGET]$BUILD_NUGET"
        displayName: 'Detect Changed Packages (NPM & NuGet)'
        env:
          API_KEY: $(Api_key)

      # ── 7. Build and Pack TypeScript / NPM Package (@syncfusion/boldcreate-connect) ──
      - bash: |
          set -e
          mkdir -p "$(npmStagingDir)"
          cd "$(REPO_DIR)/packages/sdk"

          BASE_VERSION=$(node -p "require('./package.json').version")
          MAJOR_MINOR=$(echo "$BASE_VERSION" | cut -d. -f1-2)
          NEW_VERSION="${MAJOR_MINOR}.$(Build.BuildId)"
          echo "Bumping NPM version: $BASE_VERSION -> $NEW_VERSION"

          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            p.version = process.argv[1];
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
          ' "$NEW_VERSION"

          echo "Building TypeScript SDK (@syncfusion/boldcreate-connect)..."
          pnpm run build

          echo "Packaging NPM tarball..."
          pnpm pack --pack-destination "$(npmStagingDir)"

          echo "=== Generated NPM Tarballs ==="
          ls -la "$(npmStagingDir)"
        displayName: 'Build & Pack NPM Package (.tgz)'
        workingDirectory: $(REPO_DIR)
        condition: and(succeeded(), eq(variables['BUILD_NPM'], 'true'))

      # ── 8. Build and Pack .NET / NuGet Package (Syncfusion.BoldCreate.Connect) ──
      - bash: |
          set -e
          mkdir -p "$(nugetStagingDir)"
          cd "$(REPO_DIR)/packages/sdk-dotnet"

          # Determine version from base or Build.BuildId
          BASE_VERSION="0.1"
          NEW_VERSION="${BASE_VERSION}.$(Build.BuildId)"
          echo "Packaging NuGet version: $NEW_VERSION"

          echo "Building and packing .NET SDK..."
          dotnet pack Syncfusion.BoldCreate.Connect/Syncfusion.BoldCreate.Connect.csproj \
            -c Release \
            /p:Version="$NEW_VERSION" \
            /p:PackageVersion="$NEW_VERSION" \
            -o "$(nugetStagingDir)"

          echo "=== Generated NuGet Packages (.nupkg) ==="
          ls -la "$(nugetStagingDir)"
        displayName: 'Build & Pack NuGet Package (.nupkg)'
        workingDirectory: $(REPO_DIR)
        condition: and(succeeded(), eq(variables['BUILD_NUGET'], 'true'))

      # ── 9. Publish Build Artifacts (NPM and NuGet packages) ───────────────────
      - task: PublishBuildArtifacts@1
        displayName: 'Publish NPM Tarball Artifacts'
        condition: and(succeeded(), eq(variables['BUILD_NPM'], 'true'))
        inputs:
          PathtoPublish: '$(npmStagingDir)'
          ArtifactName: 'npm-packages'

      - task: PublishBuildArtifacts@1
        displayName: 'Publish NuGet Package Artifacts'
        condition: and(succeeded(), eq(variables['BUILD_NUGET'], 'true'))
        inputs:
          PathtoPublish: '$(nugetStagingDir)'
          ArtifactName: 'nuget-packages'

      # ── 10. Publish to Pre-production Nexus (NPM & NuGet) ────────────────────
      - bash: |
          set -e
          NPM_DIR="$(npmStagingDir)"
          NUGET_DIR="$(nugetStagingDir)"

          echo "=========================================="
          echo "Publishing to Pre-production Nexus"
          echo "=========================================="

          # 1. Publish NPM to Pre-production
          if [ "${BUILD_NPM}" = "true" ] && [ -d "$NPM_DIR" ] && [ -n "$(ls -A "$NPM_DIR"/*.tgz 2>/dev/null)" ]; then
            echo "Configuring ~/.npmrc for Pre-production Nexus..."
            printf "%s\n" \
              "@syncfusion:registry=https://nexus.syncfusioninternal.com/repository/boldcreate-preproducion/" \
              "@boldcreate:registry=https://nexus.syncfusioninternal.com/repository/boldcreate-preproducion/" \
              "" \
              "//nexus.syncfusioninternal.com/repository/boldcreate-preproducion/:username=ej2" \
              "//nexus.syncfusioninternal.com/repository/boldcreate-preproducion/:_password=bGJrUHAhdEw4QzhmMzVlaA==" \
              "//nexus.syncfusioninternal.com/repository/boldcreate-preproducion/:email=pipeline@syncfusion.com" \
              "//nexus.syncfusioninternal.com/repository/boldcreate-preproducion/:always-auth=true" \
              > ~/.npmrc

            for tgz in "$NPM_DIR"/*.tgz; do
              [ -e "$tgz" ] || continue
              echo "Publishing NPM package $(basename "$tgz") to Pre-production Nexus..."
              npm publish "$tgz" --registry https://nexus.syncfusioninternal.com/repository/boldcreate-preproducion/
            done
          else
            echo "No NPM packages to publish to Pre-production."
          fi

          # 2. Publish NuGet to Pre-production
          if [ "${BUILD_NUGET}" = "true" ] && [ -d "$NUGET_DIR" ] && [ -n "$(ls -A "$NUGET_DIR"/*.nupkg 2>/dev/null)" ]; then
            echo "Publishing NuGet package(s) to Pre-production Nexus..."
            for nupkg in "$NUGET_DIR"/*.nupkg; do
              [ -e "$nupkg" ] || continue
              case "$nupkg" in *.symbols.nupkg|*.snupkg) continue ;; esac

              echo "Pushing NuGet package $(basename "$nupkg") to Pre-production Nexus..."
              dotnet nuget push "$nupkg" \
                --source "https://nexus.syncfusioninternal.com/repository/boldcreate-nuget-preproduction/" \
                --api-key "bGJrUHAhdEw4QzhmMzVlaA==" \
                --skip-duplicate || true
            done
          else
            echo "No NuGet packages to publish to Pre-production."
          fi

          echo "✅ Pre-production Publish Completed"
        displayName: 'Publish Packages to Pre-production Nexus'
        condition: and(succeeded(), or(eq(parameters.TargetEnvironment, 'Both'), eq(parameters.TargetEnvironment, 'PreproductionOnly')))

      # ── 11. Publish to Production Nexus (NPM & NuGet) ────────────────────────
      - bash: |
          set -e
          NPM_DIR="$(npmStagingDir)"
          NUGET_DIR="$(nugetStagingDir)"

          echo "=========================================="
          echo "Publishing to Production Nexus"
          echo "=========================================="

          # 1. Publish NPM to Production
          if [ "${BUILD_NPM}" = "true" ] && [ -d "$NPM_DIR" ] && [ -n "$(ls -A "$NPM_DIR"/*.tgz 2>/dev/null)" ]; then
            echo "Configuring ~/.npmrc for Production Nexus..."
            printf "%s\n" \
              "@syncfusion:registry=https://nexus.syncfusioninternal.com/repository/boldcreate-production/" \
              "@boldcreate:registry=https://nexus.syncfusioninternal.com/repository/boldcreate-production/" \
              "" \
              "//nexus.syncfusioninternal.com/repository/boldcreate-production/:username=ej2" \
              "//nexus.syncfusioninternal.com/repository/boldcreate-production/:_password=bGJrUHAhdEw4QzhmMzVlaA==" \
              "//nexus.syncfusioninternal.com/repository/boldcreate-production/:email=pipeline@syncfusion.com" \
              "//nexus.syncfusioninternal.com/repository/boldcreate-production/:always-auth=true" \
              > ~/.npmrc

            for tgz in "$NPM_DIR"/*.tgz; do
              [ -e "$tgz" ] || continue
              echo "Publishing NPM package $(basename "$tgz") to Production Nexus..."
              npm publish "$tgz" --registry https://nexus.syncfusioninternal.com/repository/boldcreate-production/
            done
          else
            echo "No NPM packages to publish to Production."
          fi

          # 2. Publish NuGet to Production
          if [ "${BUILD_NUGET}" = "true" ] && [ -d "$NUGET_DIR" ] && [ -n "$(ls -A "$NUGET_DIR"/*.nupkg 2>/dev/null)" ]; then
            echo "Publishing NuGet package(s) to Production Nexus..."
            for nupkg in "$NUGET_DIR"/*.nupkg; do
              [ -e "$nupkg" ] || continue
              case "$nupkg" in *.symbols.nupkg|*.snupkg) continue ;; esac

              echo "Pushing NuGet package $(basename "$nupkg") to Production Nexus..."
              dotnet nuget push "$nupkg" \
                --source "https://nexus.syncfusioninternal.com/repository/boldcreate-nuget-production/" \
                --api-key "bGJrUHAhdEw4QzhmMzVlaA==" \
                --skip-duplicate || true
            done
          else
            echo "No NuGet packages to publish to Production."
          fi

          echo "✅ Production Publish Completed"
        displayName: 'Publish Packages to Production Nexus'
        condition: and(succeeded(), or(eq(parameters.TargetEnvironment, 'Both'), eq(parameters.TargetEnvironment, 'ProductionOnly')))

      # ── 12. Final Pipeline Summary ───────────────────────────────────────────
      - bash: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║            PACKAGE CD PIPELINE EXECUTION SUMMARY             ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
          echo "Repository Information:"
          echo "  Repository:       $(Build.Repository.Name)"
          echo "  Published Branch: $(CHECKOUT_BRANCH)"
          echo "  Build ID:         $(Build.BuildId)"
          echo "  Commit SHA:       $(Build.SourceVersion)"
          echo "  PR Number:        ${PR_NUMBER:-None}"
          echo ""
          echo "Packages Processed:"
          echo "  NPM SDK (@syncfusion/boldcreate-connect): ${BUILD_NPM}"
          echo "  NuGet SDK (Syncfusion.BoldCreate.Connect): ${BUILD_NUGET}"
          echo "  Target Environment: ${{ parameters.TargetEnvironment }}"
          echo ""
          echo "Nexus Target Registries:"
          echo "  NPM Pre-production:   https://nexus.syncfusioninternal.com/repository/boldcreate-preproducion/"
          echo "  NPM Production:       https://nexus.syncfusioninternal.com/repository/boldcreate-production/"
          echo "  NuGet Pre-production: https://nexus.syncfusioninternal.com/repository/boldcreate-nuget-preproduction/"
          echo "  NuGet Production:     https://nexus.syncfusioninternal.com/repository/boldcreate-nuget-production/"
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                 ✅ Package Publish Complete                  ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
        displayName: 'Print Summary'
        condition: always()
