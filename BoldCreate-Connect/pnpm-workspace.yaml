  '@fastify/helmet': '13.1.1'
  '@fastify/static': '10.1.5'
  '@google-cloud/kms': '6.2.1'
  '@google-cloud/secret-manager': '7.1.1'
  '@hpke/core': '1.9.0'
  '@hpke/dhkem-x25519': '1.8.0'
  '@modelcontextprotocol/client': '2.3.1'
