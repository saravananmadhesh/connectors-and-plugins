apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: boldcreate-integrations-web-production
  namespace: boldcreate-prod
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.allow-http: 'false'
    ingress.gcp.kubernetes.io/pre-shared-cert: ssl-sfcodestudio-platformapi-production
spec:
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: boldcreate-integrations-web-production
                port: { name: http }
