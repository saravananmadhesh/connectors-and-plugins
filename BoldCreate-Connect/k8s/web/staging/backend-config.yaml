apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata: { name: boldcreate-integrations-web-backend-staging, namespace: boldcreate-stag }
spec:
  timeoutSec: 60
  healthCheck:
    type: HTTP
    requestPath: /healthz
    port: 3000
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 2
    unhealthyThreshold: 3
