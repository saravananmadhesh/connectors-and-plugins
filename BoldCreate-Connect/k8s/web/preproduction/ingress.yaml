apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: boldcreate-integrations-web-preproduction
  namespace: boldcreate-preprod
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.allow-http: 'false'
    ingress.gcp.kubernetes.io/pre-shared-cert: ssl-sfcodestudio-platformapi-preproduction
spec:
  rules:
    - host: preproduction.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: boldcreate-integrations-web-preproduction
                port: { name: http }
