apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: boldcreate-integrations-gateway-production
  namespace: boldcreate-prod
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.allow-http: 'false'
spec:
  rules:
    - host: connect-gateway.boldcreate.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: boldcreate-integrations-gateway-production
                port: { name: http }
  tls:
    - hosts:
        - api.boldcreate.ai
      secretName: ssl-boldcreate-production
