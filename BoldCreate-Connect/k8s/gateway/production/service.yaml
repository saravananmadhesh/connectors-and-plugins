apiVersion: v1
kind: Service
metadata:
  name: boldcreate-integrations-gateway-production
  namespace: boldcreate-prod
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"ports": {"http": "boldcreate-integrations-gateway-backend-production"}}'
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: boldcreate-integrations-gateway-production }
  ports: [{ name: http, port: 80, targetPort: http }]
