apiVersion: apps/v1
kind: Deployment
metadata: { name: boldcreate-integrations-gateway-production, namespace: boldcreate-prod }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: boldcreate-integrations-gateway-production }
  template:
    metadata:
      labels: { app.kubernetes.io/name: boldcreate-integrations-gateway-production }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: boldcreate-integrations-gateway-production
          image: us-east4-docker.pkg.dev/syncfusioncody/synccodestudio/boldcreate-production-integrations-gateway:#{Build.BuildId}#
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: boldcreate-integrations-gateway-config-production
            - secretRef:
                name: boldcreate-integrations-gateway-secrets-production
          ports: [{ name: http, containerPort: 3002 }]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: '1', memory: 1024Mi }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - name: tmp
          emptyDir: {}
