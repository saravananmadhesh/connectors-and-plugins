apiVersion: v1
kind: ConfigMap
metadata:
  name: boldcreate-integrations-gateway-config-production
  namespace: boldcreate-prod
data:
  NODE_ENV: production
  LOG_LEVEL: warn
  PORT_GATEWAY: '3002'
  API_BASE_URL: http://boldcreate-integrations-api-production.boldcreate-prod.svc.cluster.local:3001
  APP_BASE_URL: https://connect.boldcreate.ai
  PUBLIC_GATEWAY_URL: https://connect-gateway.boldcreate.ai
  KMS_ADAPTER: cloud-kms
  KMS_CLOUD_KEY_NAME: projects/syncfusioncody/locations/global/keyRings/boldcreate-connect-prod/cryptoKeys/boldcreate-connect-key
  NODE_TLS_REJECT_UNAUTHORIZED: '0'
  # REDIS_URL (with the Redis password) is in the secret, not here
