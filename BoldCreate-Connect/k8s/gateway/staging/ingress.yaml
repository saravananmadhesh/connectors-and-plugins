apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: boldcreate-integrations-gateway-staging
  namespace: boldcreate-stag
  annotations:
    kubernetes.io/ingress.class: gce-internal
    kubernetes.io/ingress.allow-http: 'false'
spec:
  rules:
    - host: connect-gateway-staging.boldcreate.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: boldcreate-integrations-gateway-staging
                port: { name: http }
  tls:
    - secretName: ssl-boldcreate-staging
