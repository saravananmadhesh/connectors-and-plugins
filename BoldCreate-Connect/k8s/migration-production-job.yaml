    	CONSTRAINT "installation_status_check" CHECK ("installation"."status" IN ('disabled', 'active')),
    	CONSTRAINT "installation_user_scope_shape" CHECK ("installation"."scope" != 'user' OR ("installation"."user_id" IS NOT NULL AND "installation"."team_id" IS NULL)),
    	CONSTRAINT "installation_team_scope_shape" CHECK ("installation"."scope" != 'team' OR ("installation"."team_id" IS NOT NULL AND "installation"."user_id" IS NULL)),
