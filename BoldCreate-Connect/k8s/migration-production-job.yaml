    --> statement-breakpoint
    CREATE TABLE "installation" (
    	"id" uuid PRIMARY KEY NOT NULL,
    	"organization_id" uuid NOT NULL,
    	"scope" text NOT NULL,
    	"team_id" uuid,
    	"user_id" uuid,
    	"created_by" uuid NOT NULL,
    	"plugin_id" uuid NOT NULL,
    	"plugin_version_id" uuid NOT NULL,
    	"connection_id" uuid,
