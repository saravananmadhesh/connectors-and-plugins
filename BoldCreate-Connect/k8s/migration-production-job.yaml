  0000_baseline.sql: |-
    -- 0000_baseline.sql
    CREATE TABLE "email_token" (
    	"id" uuid PRIMARY KEY NOT NULL,
    	"purpose" text NOT NULL,
    	"token_hash" text NOT NULL,
    	"target_user_id" uuid,
    	"target_email_normalized" text,
    	"org_id" uuid,
    	"invited_role" text,
    	"inviter_id" uuid,
    	"expires_at" timestamp with time zone NOT NULL,
    	"consumed_at" timestamp with time zone,
    	"created_at" timestamp with time zone DEFAULT now() NOT NULL,
    	CONSTRAINT "email_token_hash_unique" UNIQUE("token_hash"),
    	CONSTRAINT "email_token_purpose_check" CHECK ("email_token"."purpose" IN ('verification', 'reset', 'invite')),
    	CONSTRAINT "email_token_invited_role_check" CHECK ("email_token"."invited_role" IS NULL OR "email_token"."invited_role" IN ('OWNER', 'ADMIN', 'MEMBER')),
    	CONSTRAINT "email_token_verification_shape" CHECK (purpose NOT IN ('verification','reset') OR ("email_token"."target_user_id" IS NOT NULL AND "email_token"."org_id" IS NULL)),
    	CONSTRAINT "email_token_invite_shape" CHECK (purpose != 'invite' OR ("email_token"."org_id" IS NOT NULL AND "email_token"."invited_role" IS NOT NULL AND "email_token"."target_email_normalized" IS NOT NULL))
    );
    --> statement-breakpoint
    CREATE TABLE "session" (
    	"id" uuid PRIMARY KEY NOT NULL,
    	"token_hash" text NOT NULL,
    	"user_id" uuid NOT NULL,
    	"idle_expires_at" timestamp with time zone NOT NULL,
    	"absolute_expires_at" timestamp with time zone NOT NULL,
    	"revoked_at" timestamp with time zone,
    	"ip" text,
    	"user_agent" text,
    	"created_at" timestamp with time zone DEFAULT now() NOT NULL,
    	CONSTRAINT "session_token_hash_unique" UNIQUE("token_hash"),
    	CONSTRAINT "session_user_agent_length" CHECK (user_agent IS NULL OR char_length("session"."user_agent") <= 400)
    );
    --> statement-breakpoint
    CREATE TABLE "user" (
    	"id" uuid PRIMARY KEY NOT NULL,
    	"email" text NOT NULL,
    	"email_normalized" text NOT NULL,
    	"password_hash" text NOT NULL,
    	"display_name" text NOT NULL,
    	"email_verified_at" timestamp with time zone,
    	"starter_org_provisioned_at" timestamp with time zone,
    	"status" text DEFAULT 'active' NOT NULL,
    	"failed_login_count" integer DEFAULT 0 NOT NULL,
    	"locked_until" timestamp with time zone,
    	"last_login_at" timestamp with time zone,
    	"created_at" timestamp with time zone DEFAULT now() NOT NULL,
    	"updated_at" timestamp with time zone DEFAULT now() NOT NULL,
    	CONSTRAINT "user_email_normalized_unique" UNIQUE("email_normalized"),
    	CONSTRAINT "user_status_check" CHECK ("user"."status" IN ('active', 'suspended')),
    	CONSTRAINT "user_email_length" CHECK (char_length("user"."email") <= 254),
    	CONSTRAINT "user_display_name_length" CHECK (char_length("user"."display_name") <= 80)
    );
    --> statement-breakpoint
    CREATE TABLE "organization_member" (
    	"organization_id" uuid NOT NULL,
    	"user_id" uuid NOT NULL,
    	"role" text NOT NULL,
    	"created_at" timestamp with time zone DEFAULT now() NOT NULL,
    	CONSTRAINT "organization_member_pk" PRIMARY KEY("organization_id","user_id"),
    	CONSTRAINT "organization_member_role_check" CHECK ("organization_member"."role" IN ('OWNER', 'ADMIN', 'MEMBER'))
    );
    --> statement-breakpoint
    CREATE TABLE "organization" (
    	"id" uuid PRIMARY KEY NOT NULL,
    	"name" text NOT NULL,
    	"slug" text NOT NULL,
    	"created_by" uuid NOT NULL,
    	"deletion_requested_at" timestamp with time zone,
    	"created_at" timestamp with time zone DEFAULT now() NOT NULL,
    	"updated_at" timestamp with time zone DEFAULT now() NOT NULL,
    	CONSTRAINT "organization_slug_unique" UNIQUE("slug"),
    	CONSTRAINT "organization_name_length" CHECK (char_length("organization"."name") >= 3 AND char_length("organization"."name") <= 60),
    	CONSTRAINT "organization_slug_format" CHECK ("organization"."slug" ~ '^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$')
    );
    --> statement-breakpoint
    CREATE TABLE "team_member" (
    	"team_id" uuid NOT NULL,
    	"user_id" uuid NOT NULL,
    	"organization_id" uuid NOT NULL,
    	"role" text NOT NULL,
    	"created_at" timestamp with time zone DEFAULT now() NOT NULL,
    	CONSTRAINT "team_member_pk" PRIMARY KEY("team_id","user_id"),
    	CONSTRAINT "team_member_role_check" CHECK ("team_member"."role" IN ('ADMIN', 'MEMBER', 'VIEWER'))
    );
    --> statement-breakpoint
    CREATE TABLE "team" (
    	"id" uuid PRIMARY KEY NOT NULL,
    	"organization_id" uuid NOT NULL,
    	"name" text NOT NULL,
    	"slug" text NOT NULL,
    	"description" text,
    	"created_by" uuid NOT NULL,
    	"deletion_requested_at" timestamp with time zone,
    	"created_at" timestamp with time zone DEFAULT now() NOT NULL,
    	"updated_at" timestamp with time zone DEFAULT now() NOT NULL,
