    -- 0040_isolation_policies.sql
    -- Narrowing policies. They are RESTRICTIVE, so they only remove rows the organization policy allows
    -- and never add any. Each reads a setting that the caller sets for the transaction; an unset or
    -- empty setting leaves the row visible, so callers that do not set it behave as before.
    --   app.project : a project key or a project session; only rows of that project are visible.
    --   app.subject : a project session; only that user's own rows are visible.
    --   app.viewer  : '1' for an organization Viewer; the For You rows (scope other than project) are hidden.
    -- Which project an installation belongs to. A function, so a policy on another table can read it
    -- without the caller holding any privilege on the installation table.
    CREATE FUNCTION installation_project(p_installation uuid) RETURNS uuid LANGUAGE sql STABLE SECURITY DEFINER SET search_path = public AS $$ SELECT project_id FROM "installation" WHERE id = p_installation $$;--> statement-breakpoint
    CREATE POLICY installation_isolation_project ON "installation" AS RESTRICTIVE USING (nullif(current_setting('app.project', true), '') IS NULL OR project_id = nullif(current_setting('app.project', true), '')::uuid) WITH CHECK (nullif(current_setting('app.project', true), '') IS NULL OR project_id = nullif(current_setting('app.project', true), '')::uuid);--> statement-breakpoint
    CREATE POLICY installation_isolation_subject ON "installation" AS RESTRICTIVE USING (nullif(current_setting('app.subject', true), '') IS NULL OR scope <> 'user' OR user_id = nullif(current_setting('app.subject', true), '')::uuid) WITH CHECK (nullif(current_setting('app.subject', true), '') IS NULL OR scope <> 'user' OR user_id = nullif(current_setting('app.subject', true), '')::uuid);--> statement-breakpoint
    CREATE POLICY installation_isolation_viewer ON "installation" AS RESTRICTIVE USING (coalesce(current_setting('app.viewer', true), '') <> '1' OR scope = 'project') WITH CHECK (coalesce(current_setting('app.viewer', true), '') <> '1' OR scope = 'project');--> statement-breakpoint
    CREATE POLICY api_key_isolation_project ON "api_key" AS RESTRICTIVE USING (nullif(current_setting('app.project', true), '') IS NULL OR project_id = nullif(current_setting('app.project', true), '')::uuid) WITH CHECK (nullif(current_setting('app.project', true), '') IS NULL OR project_id = nullif(current_setting('app.project', true), '')::uuid);--> statement-breakpoint
    CREATE POLICY api_key_isolation_subject ON "api_key" AS RESTRICTIVE USING (nullif(current_setting('app.subject', true), '') IS NULL OR scope <> 'user' OR user_id = nullif(current_setting('app.subject', true), '')::uuid) WITH CHECK (nullif(current_setting('app.subject', true), '') IS NULL OR scope <> 'user' OR user_id = nullif(current_setting('app.subject', true), '')::uuid);--> statement-breakpoint
    CREATE POLICY mcp_oauth_token_isolation_project ON "mcp_oauth_token" AS RESTRICTIVE USING (nullif(current_setting('app.project', true), '') IS NULL OR installation_project(installation_id) = nullif(current_setting('app.project', true), '')::uuid) WITH CHECK (nullif(current_setting('app.project', true), '') IS NULL OR installation_project(installation_id) = nullif(current_setting('app.project', true), '')::uuid);--> statement-breakpoint
