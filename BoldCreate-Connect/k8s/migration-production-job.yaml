    	CONSTRAINT "team_id_organization_unique" UNIQUE("id","organization_id"),
    	CONSTRAINT "team_name_length" CHECK (char_length("team"."name") >= 3 AND char_length("team"."name") <= 60),
    	CONSTRAINT "team_slug_format" CHECK ("team"."slug" ~ '^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$'),
    	CONSTRAINT "team_description_length" CHECK ("team"."description" IS NULL OR char_length("team"."description") <= 500)
    );
    --> statement-breakpoint
    CREATE TABLE "component" (
    	"id" uuid PRIMARY KEY NOT NULL,
    	"plugin_version_id" uuid NOT NULL,
    	"kind" text DEFAULT 'mcp' NOT NULL,
    	"name" text NOT NULL,
    	"description" text NOT NULL,
    	"metadata" jsonb NOT NULL,
    	CONSTRAINT "component_version_kind_name_unique" UNIQUE("plugin_version_id","kind","name"),
    	CONSTRAINT "component_name_length" CHECK (char_length("component"."name") >= 1 AND char_length("component"."name") <= 60),
    	CONSTRAINT "component_kind_check" CHECK ("component"."kind" IN ('mcp', 'skill', 'rule', 'hook', 'agent'))
    );
    --> statement-breakpoint
    CREATE TABLE "plugin" (
    	"id" uuid PRIMARY KEY NOT NULL,
    	"name" text NOT NULL,
    	"display_name" text NOT NULL,
    	"summary" text NOT NULL,
    	"description" text NOT NULL,
    	"keywords" text[] DEFAULT '{}'::text[] NOT NULL,
    	"status" text DEFAULT 'active' NOT NULL,
    	"visibility" text DEFAULT 'public' NOT NULL,
    	"publisher_organization_id" uuid,
    	"created_at" timestamp with time zone DEFAULT now() NOT NULL,
    	"updated_at" timestamp with time zone DEFAULT now() NOT NULL,
    	CONSTRAINT "plugin_name_unique" UNIQUE("name"),
    	CONSTRAINT "plugin_name_format" CHECK ("plugin"."name" ~ '^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$'),
    	CONSTRAINT "plugin_summary_length" CHECK (char_length("plugin"."summary") <= 200),
    	CONSTRAINT "plugin_status_check" CHECK ("plugin"."status" IN ('active', 'deprecated', 'suspended')),
    	CONSTRAINT "plugin_visibility_check" CHECK ("plugin"."visibility" IN ('public'))
    );
    --> statement-breakpoint
    CREATE TABLE "plugin_version" (
    	"id" uuid PRIMARY KEY NOT NULL,
    	"plugin_id" uuid NOT NULL,
    	"version" text NOT NULL,
    	"major" integer NOT NULL,
    	"minor" integer NOT NULL,
    	"patch" integer NOT NULL,
    	"manifest_schema_version" text NOT NULL,
    	"manifest" jsonb NOT NULL,
    	"manifest_sha256" text NOT NULL,
    	"changelog" text,
    	"published_at" timestamp with time zone DEFAULT now() NOT NULL,
    	"status" text DEFAULT 'published' NOT NULL,
    	"execution_blocked_at" timestamp with time zone,
    	CONSTRAINT "plugin_version_plugin_version_unique" UNIQUE("plugin_id","version"),
    	CONSTRAINT "plugin_version_semver_format" CHECK ("plugin_version"."version" ~ '^[0-9]+.[0-9]+.[0-9]+$'),
    	CONSTRAINT "plugin_version_status_check" CHECK ("plugin_version"."status" IN ('pending', 'approved', 'published', 'rejected', 'yanked'))
    );
    --> statement-breakpoint
    CREATE TABLE "installation_component" (
    	"installation_id" uuid NOT NULL,
    	"organization_id" uuid NOT NULL,
    	"component_id" uuid NOT NULL,
    	"plugin_version_id" uuid NOT NULL,
    	"enabled" boolean DEFAULT false NOT NULL,
    	"alias" text,
    	"created_at" timestamp with time zone DEFAULT now() NOT NULL,
    	"updated_at" timestamp with time zone DEFAULT now() NOT NULL,
    	CONSTRAINT "installation_component_pk" PRIMARY KEY("installation_id","component_id"),
    	CONSTRAINT "installation_component_alias_unique" UNIQUE("installation_id","alias"),
    	CONSTRAINT "installation_component_alias_format" CHECK ("installation_component"."alias" IS NULL OR "installation_component"."alias" ~ '^[a-z][a-z0-9_]{0,47}$')
