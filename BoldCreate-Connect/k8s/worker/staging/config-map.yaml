apiVersion: v1
kind: ConfigMap
metadata:
  name: boldcreate-integrations-worker-config-staging
  namespace: boldcreate-stag
data:
  NODE_ENV: production
  LOG_LEVEL: info
  EMAIL_ADAPTER: smtp
  EMAIL_FROM: noreply@boldcreate.ai
  SMTP_HOST: email-smtp.us-east-1.amazonaws.com
  SMTP_PORT: '587'
  OUTBOX_POLL_INTERVAL_MS: '5000'
  APP_BASE_URL: https://connect-staging.boldcreate.ai
  BLOB_BUCKET: codestudio-marketplace
  BLOB_REGION: us-east-1
  NODE_TLS_REJECT_UNAUTHORIZED: '0'
  KMS_ADAPTER: cloud-kms
  KMS_CLOUD_KEY_NAME: projects/codestudio-dev/locations/global/keyRings/boldcreate-connect/cryptoKeys/boldcreate-connect-kms
