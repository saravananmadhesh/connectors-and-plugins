apiVersion: apps/v1
kind: Deployment
metadata: { name: boldcreate-integrations-worker-production, namespace: boldcreate-prod }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: boldcreate-integrations-worker-production }
  template:
    metadata:
      labels: { app.kubernetes.io/name: boldcreate-integrations-worker-production }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: boldcreate-integrations-worker-production
          image: us-east4-docker.pkg.dev/syncfusioncody/synccodestudio/boldcreate-production-integrations-worker:#{Build.BuildId}#
          imagePullPolicy: Always
          env:
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /etc/gcp/sa-key.json
          envFrom:
            - configMapRef:
                name: boldcreate-integrations-worker-config-production
            - secretRef:
                name: boldcreate-integrations-worker-secrets-production
          ports: [{ name: health, containerPort: 3005 }]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: '1', memory: 1024Mi }
          startupProbe:
            httpGet: { path: /healthz, port: health }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /readyz, port: health }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: gcp-sa-key
              mountPath: /etc/gcp
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: gcp-sa-key
          secret:
            secretName: boldcreate-gcp-sa-key
            optional: true
