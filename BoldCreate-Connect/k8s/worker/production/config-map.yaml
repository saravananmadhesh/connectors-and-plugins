apiVersion: v1
kind: ConfigMap
metadata:
  name: boldcreate-integrations-worker-config-production
  namespace: boldcreate-prod
data:
  NODE_ENV: production
  LOG_LEVEL: info
  EMAIL_PROVIDER: resend
  EMAIL_FROM: noreply@example.com
  OUTBOX_POLL_INTERVAL_MS: '5000'
  APP_BASE_URL: https://app.example.com
  BLOB_BUCKET: boldcreate-artifacts-prod
  KMS_LOCAL_KEYRING_PATH: /tmp/keyring.json
