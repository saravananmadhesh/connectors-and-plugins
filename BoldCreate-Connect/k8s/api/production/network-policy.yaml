apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: boldcreate-integrations-api-ingress-production, namespace: boldcreate-prod }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: boldcreate-integrations-api-production }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: boldcreate-integrations-web-production }
        - podSelector:
            matchLabels: { app.kubernetes.io/name: boldcreate-integrations-admin-production }
        - podSelector:
            matchLabels: { app.kubernetes.io/name: boldcreate-integrations-gateway-production }
      ports: [{ protocol: TCP, port: 3001 }]
