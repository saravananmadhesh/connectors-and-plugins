apiVersion: apps/v1
kind: Deployment
metadata: { name: boldcreate-integrations-api-preproduction, namespace: boldcreate-preprod }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: boldcreate-integrations-api-preproduction }
  template:
    metadata:
      labels: { app.kubernetes.io/name: boldcreate-integrations-api-preproduction }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: boldcreate-integrations-api-preproduction
          image: us-central1-docker.pkg.dev/codestudio-dev/synccodestudio/boldcreate-preproduction-integrations-api:#{Build.BuildId}#
          imagePullPolicy: Always
          command: [node]
          args: [dist/index.js]
          ports: [{ name: http, containerPort: 3001 }]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: '1', memory: 512Mi }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
